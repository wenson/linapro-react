<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" />
    <title>LinaPro</title>
    <style>
      html,
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #app-startup-loading {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
      }

      #app-startup-loading [data-testid="app-startup-loading-title"] {
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app-startup-loading" data-testid="app-startup-loading" role="status">
      <span data-testid="app-startup-loading-title">LinaPro</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
